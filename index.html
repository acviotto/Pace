<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F1EA;--card:#fff;--ink:#1D3A44;--muted:#4F6168;--green:#1D3A44;--soft:#FFE3D6;--accent:#C2451F}

  *{box-sizing:border-box}

  main{max-width:380px;width:100%;background:var(--card);border-radius:24px;padding:28px 24px;text-align:center}

  h1{margin:14px 0 4px;font-size:34px;font-family:Outfit,system-ui,sans-serif;letter-spacing:-.02em;color:var(--green)}
  p{margin:6px 0;color:var(--muted)}
  a.btn{display:block;margin:20px 0 6px;background:var(--green);color:var(--bg);text-decoration:none;font-weight:700;border-radius:14px;padding:14px}
  .tip{background:var(--soft);border-radius:14px;padding:12px;margin-top:16px;font-size:14px;color:var(--ink);text-align:left}

</head>

  <img src="icon-512.png" alt="">

<script>document.getElementById("open").href = APP_URL;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
